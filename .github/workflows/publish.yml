name: Publish to npm

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync version with npm registry
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          REMOTE=$(npm view "$PKG_NAME" version 2>/dev/null || echo "0.0.0")
          LOCAL=$(node -p "require('./package.json').version")
          echo "remote=$REMOTE local=$LOCAL"
          HIGHER=$(node -e "const s=(a,b)=>a.split('.').map(Number).reduce((r,n,i)=>r||n-Number(b.split('.')[i]),0);process.stdout.write(s('$REMOTE','$LOCAL')>=0?'$REMOTE':'$LOCAL')")
          npm version "$HIGHER" --no-git-tag-version --allow-same-version
          npm version patch --no-git-tag-version

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit and push version bump
        run: |
          git add package.json
          git commit -m "chore: bump version [skip ci]"
          git push
